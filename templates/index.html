<!DOCTYPE html>
<html>
<head>
    <title>Video Generation</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        h1 { color: #333; }
        form { background-color: #f4f4f4; padding: 20px; border-radius: 8px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select {
            width: 100%;
            padding: 8px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid #ddd;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover { background-color: #45a049; }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h1>Video Generation</h1>
    <form id="video-form">
        <label for="prompt">Prompt:</label>
        <input type="text" id="prompt" name="prompt" required>

        <label for="aspect_ratio">Aspect Ratio:</label>
        <select id="aspect_ratio" name="aspect_ratio">
            <option value="16:9">16:9 (Landscape)</option>
            <option value="9:16">9:16 (Portrait)</option>
        </select>

        <label for="duration">Duration (seconds):</label>
        <select id="duration" name="duration">
            <option value="4">4</option>
            <option value="6">6</option>
            <option value="8" selected>8</option>
            <option value="10">10</option>
        </select>

        <label for="num_videos">Number of Videos:</label>
        <select id="num_videos" name="num_videos">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
        </select>

        <input type="submit" value="Generate Video">
    </form>
    <div id="status"></div>

    <script>
        $(document).ready(function() {
            var pollingInterval; // Keep track of the interval

            $('#video-form').submit(function(e) {
                e.preventDefault();
                // Stop any previous polling
                if (pollingInterval) {
                    clearInterval(pollingInterval);
                }

                var formData = {
                    prompt: $('#prompt').val(),
                    aspect_ratio: $('#aspect_ratio').val(),
                    duration: parseInt($('#duration').val(), 10),
                    num_videos: parseInt($('#num_videos').val(), 10)
                };

                $('#status').html('Job submitted. Waiting for Job ID...');

                $.ajax({
                    type: 'POST',
                    url: '/api/generate-video',
                    data: JSON.stringify(formData),
                    contentType: 'application/json',
                    success: function(data) {
                        var job_id = data.job_id;
                        $('#status').html('Job ID: ' + job_id + ' - Status: pending');
                        pollStatus(job_id);
                    },
                    error: function(jqXHR, textStatus, errorThrown) {
                        var errorMsg = 'Error: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.error : errorThrown);
                        $('#status').html(errorMsg);
                    }
                });
            });

            function pollStatus(job_id) {
                pollingInterval = setInterval(function() {
                    $.get('/api/check-status/' + job_id, function(data) {
                        var statusHtml = 'Job ID: ' + job_id + ' - Status: ' + data.status;
                        if (data.status === 'complete') {
                            clearInterval(pollingInterval);
                            if (data.video_url) {
                                statusHtml += '<br><a href="' + data.video_url + '" target="_blank">View Video</a>';
                            }
                            if (data.video_urls && Array.isArray(data.video_urls)) {
                                data.video_urls.forEach(function(url, index) {
                                    statusHtml += '<br><a href="' + url + '" target="_blank">View Video ' + (index + 1) + '</a>';
                                });
                            }
                        } else if (data.status === 'failed') {
                            clearInterval(pollingInterval);
                            statusHtml += '<br>Error: ' + data.error;
                        }
                        $('#status').html(statusHtml);
                    }).fail(function(jqXHR, textStatus, errorThrown) {
                        // Stop polling on error to prevent infinite loops on 404s etc.
                        clearInterval(pollingInterval);
                        var errorMsg = 'Error checking status: ' + (jqXHR.responseJSON ? jqXHR.responseJSON.error : errorThrown);
                         $('#status').html(errorMsg);
                    });
                }, 10000); // Poll every 10 seconds
            }
        });
    </script>
</body>
</html>
